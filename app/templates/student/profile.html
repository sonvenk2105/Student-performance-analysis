{% extends 'base.html' %}{% block title %}Student profile · Academic Insight{% endblock %}{% block content %}<div class="page-head"><div><div class="eyebrow">ACCOUNT</div><h1>Student profile</h1></div></div><form method="post" class="panel narrow"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input name="name" value="{{ current_user.name }}" required maxlength="120"></label><label>Email (optional)<input name="email" type="email" value="{{ current_user.email or '' }}" maxlength="254"></label><label>Student ID / USN<input value="{{ current_user.student_id }}" disabled></label><label>College<input value="{{ current_user.college_name }}" disabled></label><label>Course<input value="{{ current_user.course }}" disabled></label><label>Current semester<input value="{{ current_user.semester }}" disabled></label><p class="help-text">Student ID, college, course and semester changes are handled by the college administrator. You can add an email address here if you want to.</p><button class="button primary">Save profile</button></form>{% endblock %}
