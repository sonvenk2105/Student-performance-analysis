{% extends 'base.html' %}
{% block title %}Student password · Academic Insight{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card" role="dialog" aria-modal="true" aria-labelledby="password-title">
    <div class="eyebrow">STUDENT SIGN-IN</div>
    <h1 id="password-title">Enter your student password</h1>
    <p class="muted">Use the password you saved during your first sign-in.</p>
    <form method="post" action="{{ url_for('auth.student_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Student password<input name="password" type="password" required autocomplete="current-password" autofocus></label>
      <button class="button primary full" type="submit">Continue</button>
    </form>
    <p class="auth-foot"><a href="{{ url_for('auth.forgot_student_password') }}">Forgot your student password?</a></p>
    <p class="auth-foot"><a href="{{ url_for('auth.login') }}">Back to sign in</a></p>
  </div>
</section>
{% endblock %}
