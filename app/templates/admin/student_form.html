{% extends 'base.html' %}{% block title %}{{ 'Edit student' if student else 'Create student' }} · Academic Insight{% endblock %}{% block content %}<div class="page-head"><div><div class="eyebrow">ADMINISTRATION</div><h1>{{ 'Edit student account' if student else 'Create student account' }}</h1></div><a class="button secondary" href="{{ url_for('admin.students') }}">Back to students</a></div><form class="panel narrow" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name<input name="name" value="{{ student.name if student else '' }}" maxlength="120" required></label><label>Student ID / USN<input name="student_id" value="{{ student.student_id if student else '' }}" maxlength="40" required></label><label>College name<input name="college_name" value="{{ student.college_name if student else '' }}" maxlength="150" required></label><label>Email<input name="email" type="email" value="{{ student.email if student and student.email else '' }}" maxlength="254" {% if not student %}required{% endif %}></label><label>Course<input name="course" value="{{ student.course if student else '' }}" maxlength="100" required></label><label>Semester<input name="semester" type="number" min="1" max="20" value="{{ student.semester if student else 1 }}" required></label><button class="button primary">{{ 'Save changes' if student else 'Create account' }}</button></form>{% endblock %}
