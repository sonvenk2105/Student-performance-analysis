services:
  - type: web
    name: student-performance-analysis
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: "flask --app wsgi:app db upgrade && flask --app wsgi:app init-grading && gunicorn --bind 0.0.0.0:$PORT wsgi:app"
    healthCheckPath: /health
    initialDeployHook: flask --app wsgi:app create-admin
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: student-performance-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: student-performance-db
    databaseName: student_performance
    user: student_app
    plan: free
    region: singapore
